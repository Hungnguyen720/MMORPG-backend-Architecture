# Items and loot. Rare and epic drops are written to the database the moment
# they drop; everything else is saved with the inventory on every change.
items:
  - { id: wolf_pelt, name: Wolf Pelt, rarity: poor, stack: 20, icon: pelt, description: "Soft, if a little bloody." }
  - { id: boar_tusk, name: Boar Tusk, rarity: poor, stack: 20, icon: tusk }
  - { id: cultist_sigil, name: Cultist Sigil, rarity: common, stack: 20, icon: sigil }
  - { id: bone_dust, name: Bone Dust, rarity: poor, stack: 50, icon: dust }

  - id: minor_healing_potion
    name: Minor Healing Potion
    rarity: common
    stack: 10
    use_cooldown_ms: 30000
    icon: potion_red
    description: "Restores 1,500 health."
    on_use:
      - heal: { base: 1500 }

  - id: mana_draught
    name: Mana Draught
    rarity: common
    stack: 10
    use_cooldown_ms: 30000
    icon: potion_blue
    description: "Restores 400 mana."
    on_use:
      - restore_mana: { amount: 400 }

  - { id: apprentice_hood, name: Apprentice Hood, rarity: common, equip: head, stats: { max_hp: 120, spell_power: 6 }, icon: hood }
  - { id: woven_robe, name: Woven Robe, rarity: uncommon, equip: chest, stats: { max_hp: 250, spell_power: 12 }, icon: robe }
  - { id: trail_leggings, name: Trail Leggings, rarity: common, equip: legs, stats: { max_hp: 150 }, icon: legs }
  - { id: elderwood_staff, name: Elderwood Staff, rarity: uncommon, equip: weapon, stats: { spell_power: 45 }, icon: staff }
  - { id: heartwood_charm, name: Heartwood Charm, rarity: rare, equip: trinket, stats: { max_hp: 400, spell_power: 30 }, icon: charm }
  - { id: gravecloth_mantle, name: Gravecloth Mantle, rarity: uncommon, equip: chest, stats: { max_hp: 420, spell_power: 22, max_mana: 80 }, icon: robe_dark }
  - { id: ossuary_wand, name: Ossuary Wand, rarity: rare, equip: weapon, stats: { spell_power: 90 }, icon: wand }
  - { id: archivists_codex, name: "Archivist's Codex", rarity: epic, equip: trinket, stats: { max_hp: 900, spell_power: 70, max_mana: 200 }, icon: book }

loot_tables:
  - id: wolf
    entries:
      - { item: wolf_pelt, chance: 0.7, min: 1, max: 2 }
      - { item: minor_healing_potion, chance: 0.15 }
      - { item: trail_leggings, chance: 0.05 }
  - id: boar
    entries:
      - { item: boar_tusk, chance: 0.7, min: 1, max: 2 }
      - { item: minor_healing_potion, chance: 0.15 }
      - { item: apprentice_hood, chance: 0.05 }
  - id: cultist
    entries:
      - { item: cultist_sigil, chance: 0.6 }
      - { item: mana_draught, chance: 0.25 }
      - { item: woven_robe, chance: 0.06 }
      - { item: elderwood_staff, chance: 0.04 }
  - id: treant
    entries:
      - { item: heartwood_charm, chance: 1.0 }
      - { item: elderwood_staff, chance: 0.5 }
  - id: crypt_minor
    entries:
      - { item: bone_dust, chance: 0.8, min: 1, max: 3 }
      - { item: minor_healing_potion, chance: 0.2 }
      - { item: mana_draught, chance: 0.15 }
      - { item: gravecloth_mantle, chance: 0.04 }
  - id: crypt_boss
    entries:
      - { item: archivists_codex, chance: 0.5 }
      - { item: ossuary_wand, chance: 1.0 }
