[package]
name = "services"
version = "0.1.0"
edition = "2024"

# The library half (API types, Redis keys, tokens) is shared with the game
# client, which builds it with default-features = false so none of the
# server stack ends up in the Godot extension.
[features]
default = ["server"]
server = ["dep:argon2", "dep:axum", "dep:persistence", "dep:redis", "dep:reqwest", "dep:tokio"]

[[bin]]
name = "login"
required-features = ["server"]

[[bin]]
name = "world"
required-features = ["server"]

[[bin]]
name = "packc"

[dependencies]
argon2 = { version = "0.5", optional = true }
axum = { version = "0.8", optional = true }
base64 = "0.22"
combat-core = { version = "0.1.0", path = "../combat-core" }
persistence = { version = "0.1.0", path = "../persistence", optional = true }
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "aio"], optional = true }
renetcode = "2.0.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"], optional = true }
