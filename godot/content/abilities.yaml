# Content pack. Everything the combat engine knows about the class, the
# world's mobs and the pawns lives here: change numbers, restart the server, and the client picks the
# same file up on launch. A different tenant ships a different file.

class:
  name: Spellweaver
  max_hp: 5000
  max_mana: 1000
  mana_regen_per_sec: 18
  spell_power: 400
  crit_chance: 0.15
  move_speed: 7.0          # metres per second
  hp_regen_per_sec: 250    # once out of combat for 6 s
  respawn_ms: 5000

abilities:
  # Key 1. Hard cast: the bread-and-butter nuke.
  - id: frost_lance
    name: Frost Lance
    cast_ms: 2000
    gcd_ms: 1500
    mana_cost: 20
    range: 30
    color: "#5ab4ff"
    anim: cast_2h_forward
    vfx: frost_lance
    effects:
      - damage: { school: frost, base: 900, coeff_spellpower: 1.0 }

  # Key 2. Instant on the GCD.
  - id: ice_shard
    name: Ice Shard
    gcd_ms: 1500
    mana_cost: 12
    range: 30
    color: "#a8e4ff"
    anim: cast_1h
    vfx: ice_shard
    effects:
      - damage: { school: frost, base: 450, coeff_spellpower: 0.5 }

  # Key 3. Channel: four ticks over three seconds, broken by movement.
  - id: arcane_torrent
    name: Arcane Torrent
    channel_ms: 3000
    channel_ticks: 4
    gcd_ms: 1500
    mana_cost: 30
    range: 30
    color: "#c58bff"
    anim: channel
    vfx: arcane_beam
    effects:
      - damage: { school: arcane, base: 300, coeff_spellpower: 0.35 }

  # Key 4. Instant DoT.
  - id: searing_brand
    name: Searing Brand
    gcd_ms: 1500
    mana_cost: 15
    range: 30
    color: "#ff8a3d"
    anim: cast_1h
    vfx: fire_brand
    effects:
      - apply_aura: { aura: searing_brand }

  # Key 5. Off the GCD with its own cooldown: weave it between anything.
  - id: arcane_surge
    name: Arcane Surge
    gcd_ms: 0
    cooldown_ms: 15000
    range: 30
    cast_while_moving: true
    color: "#ff5ad1"
    anim: cast_1h
    vfx: arcane_burst
    effects:
      - damage: { school: arcane, base: 800, coeff_spellpower: 0.8 }

auras:
  - id: searing_brand
    name: Searing Brand
    duration_ms: 12000
    tick_ms: 2000
    tick_base: 160
    tick_coeff_spellpower: 0.2

dummy:
  name: Training Dummy
  max_hp: 250000
  reset_after_ms: 10000
  position: [0.0, 0.0, -10.0]

# ---------------------------------------------------------------------------
# Greybox world. The map is 120 x 120 m (movement::ARENA_HALF_EXTENT = 60).
# +Z is "south" (toward the bottom-left of the isometric screen).

world:
  spawn: [0.0, 0.0, 4.0]

# Hostile NPC types. Every number here is a first guess to tune by playing.
mobs:
  - id: ghoul
    name: Ghoul
    max_hp: 6000
    move_speed: 5.0
    attack_range: 2.0
    attack_ms: 2000
    attack_damage: 160
    aggro_radius: 9
    leash_radius: 30
    respawn_ms: 20000
    color: "#7a8a5a"

  - id: ghoul_brute
    name: Ghoul Brute
    max_hp: 18000
    move_speed: 4.2
    attack_range: 2.6
    attack_ms: 2600
    attack_damage: 420
    aggro_radius: 10
    leash_radius: 30
    respawn_ms: 40000
    scale: 1.45
    color: "#5d6b3f"

  - id: bone_archer
    name: Bone Archer
    max_hp: 4500
    move_speed: 4.5
    attack_range: 18
    attack_ms: 2400
    attack_damage: 190
    aggro_radius: 16
    leash_radius: 32
    respawn_ms: 20000
    color: "#c8c0a8"

  - id: dire_wolf
    name: Dire Wolf
    max_hp: 3800
    move_speed: 8.0
    attack_range: 1.8
    attack_ms: 1500
    attack_damage: 110
    aggro_radius: 12
    leash_radius: 35
    respawn_ms: 20000
    scale: 0.75
    color: "#6b6560"

# Where mobs stand. `count` spreads them on a small ring.
camps:
  - { mob: ghoul, position: [-28.0, 0.0, -24.0], count: 3 }
  - { mob: ghoul, position: [28.0, 0.0, -26.0], count: 2 }
  - { mob: ghoul_brute, position: [30.0, 0.0, -30.0] }
  - { mob: bone_archer, position: [0.0, 0.0, -44.0], count: 3 }
  - { mob: ghoul, position: [0.0, 0.0, -38.0], count: 2 }
  - { mob: dire_wolf, position: [34.0, 0.0, 30.0], count: 3 }
  - { mob: dire_wolf, position: [-36.0, 0.0, 32.0], count: 2 }

# AI companions. Each player brings `pawn_party` until hiring exists.
pawns:
  - id: sentinel
    name: Sentinel
    role: melee
    max_hp: 7000
    move_speed: 7.5
    attack_range: 2.2
    attack_ms: 1800
    attack_damage: 320
    threat_mult: 4.0       # holds enemies off you
    respawn_ms: 15000
    color: "#5a8fd0"

  - id: mystic
    name: Mystic
    role: healer
    max_hp: 4000
    move_speed: 7.5
    attack_range: 16
    attack_ms: 2200
    attack_damage: 200
    heal_amount: 700
    respawn_ms: 15000
    color: "#7ad0a0"

  - id: ranger
    name: Ranger
    role: ranged
    max_hp: 4500
    move_speed: 7.5
    attack_range: 18
    attack_ms: 2000
    attack_damage: 330
    respawn_ms: 15000
    color: "#d0b45a"

pawn_party: [sentinel, mystic]
