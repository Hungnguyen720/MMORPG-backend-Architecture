# Abilities and auras. The five player abilities are the Phase 0 kit,
# unchanged: combat-feel tuning waits on the hands-on test.

abilities:
  # Key 1. Hard cast: the bread-and-butter nuke.
  - id: frost_lance
    name: Frost Lance
    cast_ms: 2000
    gcd_ms: 1500
    mana_cost: 20
    range: 30
    color: "#5ab4ff"
    anim: cast_2h_forward
    vfx: frost_lance
    effects:
      - damage: { school: frost, base: 900, coeff_spellpower: 1.0 }

  # Key 2. Instant on the GCD.
  - id: ice_shard
    name: Ice Shard
    gcd_ms: 1500
    mana_cost: 12
    range: 30
    color: "#a8e4ff"
    anim: cast_1h
    vfx: ice_shard
    effects:
      - damage: { school: frost, base: 450, coeff_spellpower: 0.5 }

  # Key 3. Channel: four ticks over three seconds, broken by movement.
  - id: arcane_torrent
    name: Arcane Torrent
    channel_ms: 3000
    channel_ticks: 4
    gcd_ms: 1500
    mana_cost: 30
    range: 30
    color: "#c58bff"
    anim: channel
    vfx: arcane_beam
    effects:
      - damage: { school: arcane, base: 300, coeff_spellpower: 0.35 }

  # Key 4. Instant DoT.
  - id: searing_brand
    name: Searing Brand
    gcd_ms: 1500
    mana_cost: 15
    range: 30
    color: "#ff8a3d"
    anim: cast_1h
    vfx: fire_brand
    effects:
      - apply_aura: { aura: searing_brand }

  # Key 5. Off the GCD with its own cooldown: weave it between anything.
  - id: arcane_surge
    name: Arcane Surge
    gcd_ms: 0
    cooldown_ms: 15000
    range: 30
    cast_while_moving: true
    color: "#ff5ad1"
    anim: cast_1h
    vfx: arcane_burst
    effects:
      - damage: { school: arcane, base: 800, coeff_spellpower: 0.8 }

  # ---- Mob abilities. Same rules engine, same cast bars. ----
  - id: shadow_bolt
    name: Shadow Bolt
    cast_ms: 2500
    gcd_ms: 1500
    cooldown_ms: 6000
    range: 30
    color: "#8a5cff"
    anim: cast_1h
    vfx: shadow_bolt
    effects:
      - damage: { school: shadow, base: 380, coeff_spellpower: 1.0 }

  - id: rending_bite
    name: Rending Bite
    gcd_ms: 1500
    cooldown_ms: 9000
    range: 3
    requires_los: false
    color: "#c0392b"
    anim: attack_1h_2
    vfx: bite
    effects:
      - apply_aura: { aura: bleeding }

auras:
  - id: searing_brand
    name: Searing Brand
    duration_ms: 12000
    tick_ms: 2000
    tick_base: 160
    tick_coeff_spellpower: 0.2

  - id: bleeding
    name: Bleeding
    duration_ms: 8000
    tick_ms: 2000
    tick_base: 90
