# Zones: size, walls, spawns, portals. The client builds its collision from
# the same data the server validates movement against.
zones:
  - id: elderwood
    name: Elderwood
    half_extent: [160, 160]
    player_spawn: [0, 0, 0]
    graveyard: [-12, 0, 12]
    scene: forest
    ground_color: "#2a3a2c"
    blockers:
      # Training yard fence, north of the spawn (open to the south).
      - { center: [-12, -20], size: [1, 16], height: 1.2 }
      - { center: [12, -20], size: [1, 16], height: 1.2 }
      - { center: [0, -28], size: [24, 1], height: 1.2 }
      # Ruined walls between the spawn and the wolf woods.
      - { center: [40, -30], size: [2, 30] }
      - { center: [55, -10], size: [20, 2] }
      # Cultist camp palisade, south, gate on the north side.
      - { center: [28, 70], size: [2, 40], height: 4 }
      - { center: [72, 70], size: [2, 40], height: 4 }
      - { center: [50, 90], size: [46, 2], height: 4 }
      - { center: [35, 50], size: [16, 2], height: 4 }
      - { center: [65, 50], size: [16, 2], height: 4 }
      # Standing stones scattered around.
      - { center: [-40, -40], size: [3, 3], height: 5 }
      - { center: [-70, 60], size: [4, 2], height: 5 }
      - { center: [90, -90], size: [3, 3], height: 5 }
    spawns:
      - { mob: training_dummy, pos: [0, 0, -15] }
      - { mob: training_dummy, pos: [-6, 0, -18] }
      - { mob: training_dummy, pos: [6, 0, -18] }
      - { mob: forest_wolf, pos: [70, 0, -60], count: 8, radius: 22, respawn_ms: 20000 }
      - { mob: forest_wolf, pos: [100, 0, -110], count: 6, radius: 18, respawn_ms: 20000 }
      - { mob: wild_boar, pos: [-60, 0, 20], count: 8, radius: 25, respawn_ms: 20000 }
      - { mob: wild_boar, pos: [-110, 0, -60], count: 6, radius: 20, respawn_ms: 20000 }
      - { mob: cultist_adept, pos: [50, 0, 70], count: 6, radius: 12, respawn_ms: 25000 }
      - { mob: elder_treant, pos: [-100, 0, 110], respawn_ms: 120000 }
    portals:
      - { pos: [130, 0, -135], radius: 3, to_zone: hollow_crypt, to_pos: [0, 0, 80], name: Hollow Crypt }

  - id: hollow_crypt
    name: Hollow Crypt
    half_extent: [100, 100]
    player_spawn: [0, 0, 80]
    graveyard: [0, 0, 85]
    scene: crypt
    ground_color: "#2b2a30"
    blockers:
      # Entrance hall walls.
      - { center: [-12, 70], size: [2, 30], height: 5 }
      - { center: [12, 70], size: [2, 30], height: 5 }
      # Ossuary rows.
      - { center: [-40, 20], size: [30, 2], height: 4 }
      - { center: [40, 20], size: [30, 2], height: 4 }
      - { center: [-40, -10], size: [30, 2], height: 4 }
      - { center: [40, -10], size: [30, 2], height: 4 }
      # Boss chamber, gap in the middle of its south wall.
      - { center: [-24, -50], size: [32, 2], height: 6 }
      - { center: [24, -50], size: [32, 2], height: 6 }
      - { center: [-40, -70], size: [2, 40], height: 6 }
      - { center: [40, -70], size: [2, 40], height: 6 }
    spawns:
      - { mob: skeleton_warrior, pos: [-40, 0, 40], count: 6, radius: 14, respawn_ms: 25000 }
      - { mob: skeleton_warrior, pos: [40, 0, 40], count: 6, radius: 14, respawn_ms: 25000 }
      - { mob: bone_hound, pos: [-45, 0, 5], count: 5, radius: 10, respawn_ms: 25000 }
      - { mob: crypt_cultist, pos: [45, 0, 5], count: 5, radius: 10, respawn_ms: 30000 }
      - { mob: crypt_cultist, pos: [0, 0, -30], count: 4, radius: 10, respawn_ms: 30000 }
      - { mob: archivist_morvane, pos: [0, 0, -75], respawn_ms: 300000 }
    portals:
      - { pos: [0, 0, 95], radius: 3, to_zone: elderwood, to_pos: [124, 0, -129], name: Elderwood }
